name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # P3-6: CI so the test suite runs on every push/PR.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          # P1-CI: the dev/test deps (pytest, pytest-asyncio, edge ML stack)
          # live in requirements-dev.txt. Without this, `python -m pytest`
          # fails on a clean runner because pytest is never installed.
          pip install -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall -q flowsense tests
      - name: Run tests
        run: python -m pytest -q
