services:
  postgres:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: flowsense
      POSTGRES_PASSWORD: flowsense
      POSTGRES_DB: flowsense
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - flowsense-network
    # P3-19: healthcheck so the api container waits for Postgres to accept
    # connections instead of racing at startup.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowsense -d flowsense"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v1.1.0
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    volumes:
      - garage-data:/var/lib/garage
      - ./config/garage.toml:/etc/garage.toml
    networks:
      - flowsense-network
    command: garage server

  api:
    build: .
    ports:
      - "8000:8000"
    # P3-19: wait for postgres to be healthy before starting.
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    # P1-14: inside the compose network the garage service is reachable by name.
    environment:
      - GARAGE_ENDPOINT=http://garage:3900
    volumes:
      # P3-19: persist local data (jsonl, frames, sync queue) across restarts.
      - ./data:/app/data
    networks:
      - flowsense-network

volumes:
  postgres-data:
  garage-data:

networks:
  flowsense-network:
    driver: bridge
