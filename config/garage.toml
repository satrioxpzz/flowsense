metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

# P1-14: Garage v1.x refuses to start without rpc_secret + rpc_bind_addr.
# SECURITY: do NOT commit a real secret. Set the actual 64-char hex value via
# the GARAGE_RPC_SECRET env var (see .env.example) and substitute it here, or
# inject it at deploy time. This placeholder is intentionally non-functional.
rpc_secret = "CHANGE_ME_SET_GARAGE_RPC_SECRET_IN_ENV"
rpc_bind_addr = "[::]:3903"

[s3_api]
# Region MUST match GARAGE_REGION in .env (was "us-east-1" here vs "garage" there).
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[s3_web]
bind_addr = "[::]:3901"
root_domain = ".web.garage.localhost"

[admin]
api_bind_addr = "[::]:3902"
