# Ruff lint/format configuration (P3-6: basic linter/formatter hygiene).
# Run:  pip install ruff && ruff check . && ruff format --check .

line-length = 100
target-version = "py313"

[lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "E402"]

[lint.per-file-ignores]
"tests/*" = ["F401", "F811"]
"*.py" = []

[format]
quote-style = "double"
